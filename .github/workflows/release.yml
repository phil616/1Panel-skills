name: Release skill ZIP

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Validate ZIP on Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '24']
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a tag on the default branch history
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_TYPE" == tag ]] || { echo 'Select or push a version tag'; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: git diff --exit-code -- dist
      - run: npm run test:package
      - name: Build standalone skill archive
        run: python3 tools/skill_zip.py build --version "$RELEASE_TAG" --output-dir release
      - name: Verify archive and run extracted CLI without dependencies
        run: python3 tools/skill_zip.py verify --archive "release/1panel-skills-$RELEASE_TAG.zip" --version "$RELEASE_TAG" --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.node == '24'
        with:
          name: skill-release
          path: release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified GitHub Release
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: skill-release
          path: release
          digest-mismatch: error
      - name: Create draft, upload, verify downloaded bytes, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ github.sha }}
        run: bash tools/publish-skill-release.sh release
